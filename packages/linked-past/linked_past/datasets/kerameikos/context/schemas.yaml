classes:
  Person:
    label: "Person (painter or potter)"
    comment: "A named or conventionally named ancient vase painter or potter (230 instances, e.g. Exekias, the Berlin Painter). Every Person is also a skos:Concept. Painter/potter roles are on org:Membership nodes, not on the person."
    uri: "crm:E21_Person"
    properties:
      - pred: "skos:prefLabel"
        range: "xsd:string"
        comment: "Name with a language tag in up to 100+ languages; filter lang(?l) = 'en' or you get one row per language ('Exekias'@en, 'Εξηκίας'@el)"
      - pred: "skos:definition"
        range: "xsd:string"
        comment: "English prose biography, usually starting 'The X Painter is an Athenian red-figure painter active ca. 520-500 BCE ...'; the only place technique and working dates appear for most persons"
      - pred: "org:hasMembership"
        range: "org:Membership"
        comment: "Links to a Membership node whose URI is the person URI plus '#painter' or '#potter' (216 of 230 persons have one)"
      - pred: "skos:exactMatch"
        range: "xsd:anyURI"
        comment: "Concordances: British Museum term (BIOG...), Getty ULAN, Wikidata entity, VIAF, GND, LGPN"
      - pred: "skos:related"
        range: "crm:E21_Person"
        comment: "Pairs the black-figure and red-figure identities of one artist, e.g. kid:psiax_black_figure and kid:psiax_red_figure"
      - pred: "skos:broader"
        range: "crm:E74_Group"
        comment: "Rare (1 case): places a painter inside a Group"
      - pred: "rdfs:seeAlso"
        range: "xsd:anyURI"
        comment: "Getty Museum maker page or Beazley Archive page"
      - pred: "dcterms:isReplacedBy"
        range: "crm:E21_Person"
        comment: "Deprecated concept redirect (1 case: kid:andokides_painter)"

  Membership:
    label: "Membership (role of a person or group)"
    comment: "Reified role assertion: a person is a painter and/or potter; a group is a 'group' or a 'class'. URIs look like kid:exekias#painter. It does not link persons to groups."
    uri: "org:Membership"
    properties:
      - pred: "org:role"
        range: "org:Role"
        comment: "One of kid:painter (186), kid:potter (30), kid:group (28), kid:class (11)"
      - pred: "edm:begin"
        range: "xsd:gYear"
        comment: "Start of activity as an xsd:gYear literal like \"-0470\"^^xsd:gYear (BC negative, zero padded); compare with xsd:integer(STR(?begin)); present on only 7 painter memberships"
      - pred: "edm:end"
        range: "xsd:gYear"
        comment: "End of activity as an xsd:gYear literal like \"-0440\"^^xsd:gYear; compare with xsd:integer(STR(?end)); present on only 7 painter memberships"

  Group:
    label: "Group or Class of painters"
    comment: "A Beazley-style group, workshop, or class of Athenian vase painters (40 instances, e.g. Pioneer Group, Tyrrhenian Group, Segment Class). Membership role kid:group vs kid:class distinguishes the two."
    uri: "crm:E74_Group"
    properties:
      - pred: "skos:prefLabel"
        range: "xsd:string"
        comment: "Name, multilingual; filter lang(?l) = 'en'"
      - pred: "skos:definition"
        range: "xsd:string"
        comment: "English prose: what the group is, its date range, and where it was active"
      - pred: "org:hasMembership"
        range: "org:Membership"
        comment: "Membership node whose org:role is kid:group or kid:class"
      - pred: "skos:exactMatch"
        range: "xsd:anyURI"
        comment: "British Museum, Getty ULAN, Wikidata, VIAF"

  Shape:
    label: "Shape (vessel form)"
    comment: "A vessel form such as amphora, kylix, or volute krater (127 instances). Hierarchical: 62 shapes have a skos:broader parent shape (Volute Krater -> Krater)."
    uri: "kon:Shape"
    properties:
      - pred: "skos:prefLabel"
        range: "xsd:string"
        comment: "Name, multilingual ('Skyphos'@en, 'Σκύφος'@el); filter lang(?l) = 'en'"
      - pred: "skos:altLabel"
        range: "xsd:string"
        comment: "Alternative spellings and synonyms ('Oenochoe' for oinochoe, 'Cotyla' for kotyle), 26 in total"
      - pred: "skos:definition"
        range: "xsd:string"
        comment: "English description of form and function"
      - pred: "skos:broader"
        range: "kon:Shape"
        comment: "Parent shape (kid:stemless_cup -> kid:cup); 62 shapes have one"
      - pred: "ontolex:otherForm"
        range: "ontolex:Form"
        comment: "Blank-ish node carrying the Greek plural: ?f ontolex:writtenRep 'Skyphoi' ; lexinfo:number lexinfo:plural (36 shapes)"
      - pred: "skos:exactMatch"
        range: "xsd:anyURI"
        comment: "Getty AAT, British Museum object-name term, Wikidata"
      - pred: "dcterms:source"
        range: "xsd:anyURI"
        comment: "Bibliographic source in the DAI Zenon catalogue (zenon.dainst.org/Record/...)"
      - pred: "rdfs:seeAlso"
        range: "xsd:anyURI"
        comment: "Beazley Archive shape page or Perseus text"

  Technique:
    label: "Technique"
    comment: "A method of forming, decorating, or firing (22 instances): black-figure, red-figure, white ground, Six's technique, coral red, added white, incised. Note black-figure and red-figure are Techniques, not Styles."
    uri: "kon:Technique"
    properties:
      - pred: "skos:prefLabel"
        range: "xsd:string"
        comment: "Name, multilingual; filter lang(?l) = 'en'"
      - pred: "skos:definition"
        range: "xsd:string"
        comment: "English description of the process"
      - pred: "skos:broader"
        range: "kon:Technique"
        comment: "Parent technique (4 cases, e.g. added red -> added color)"
      - pred: "skos:exactMatch"
        range: "xsd:anyURI"
        comment: "Getty AAT, British Museum, Wikidata"
      - pred: "skos:closeMatch"
        range: "xsd:anyURI"
        comment: "Getty AAT near-equivalents for black-figure and red-figure"

  Style:
    label: "Style"
    comment: "A decorative or regional style (only 3 instances: Wild Goat Style, Marine Style, South Italian). Most 'style' questions are really about Technique or Period."
    uri: "kon:Style"
    properties:
      - pred: "skos:prefLabel"
        range: "xsd:string"
        comment: "Name, multilingual"
      - pred: "skos:definition"
        range: "xsd:string"
        comment: "English description"
      - pred: "skos:exactMatch"
        range: "xsd:anyURI"
        comment: "Getty AAT, Wikidata"

  Material:
    label: "Material"
    comment: "Material of a vessel or object (11 instances: terracotta, bronze, silver, gold, glass, marble, bone, lead, alabaster, rock, metal)."
    uri: "crm:E57_Material"
    properties:
      - pred: "skos:prefLabel"
        range: "xsd:string"
        comment: "Name, multilingual (over 90 languages for terracotta)"
      - pred: "skos:broader"
        range: "crm:E57_Material"
        comment: "Parent material (silver -> metal), 5 cases"
      - pred: "skos:exactMatch"
        range: "xsd:anyURI"
        comment: "Getty AAT, British Museum, Wikidata"

  Place:
    label: "Production place"
    comment: "A region or city where pottery was produced (7 instances: Athens, Attica, Corinth, Crete, Italy, South Italy, Apulia). Coordinates and geometry hang off a separate node at <place URI>#this."
    uri: "crm:E53_Place"
    properties:
      - pred: "skos:prefLabel"
        range: "xsd:string"
        comment: "Name, multilingual"
      - pred: "skos:broader"
        range: "crm:E53_Place"
        comment: "Containing region (Athens -> Attica, Apulia -> South Italy)"
      - pred: "skos:exactMatch"
        range: "xsd:anyURI"
        comment: "Pleiades place (6 of 7), Getty TGN, Wikidata, GeoNames, DBpedia, British Museum"
      - pred: "geo:location"
        range: "geo:SpatialThing"
        comment: "Node <place>#this carrying geo:lat / geo:long for points and crmgeo:asWKT (POINT or POLYGON) for all 4 that have geometry"
      - pred: "crm:P168_place_is_defined_by"
        range: "crmgeo:SP5_Geometric_Place_Expression"
        comment: "Same #this node as geo:location"

  Period:
    label: "Period"
    comment: "A chronological period of Greek art (4 instances: Geometric, Orientalizing, Archaic, Classical) with a CIDOC-CRM time-span."
    uri: "crm:E4_Period"
    properties:
      - pred: "skos:prefLabel"
        range: "xsd:string"
        comment: "Name, multilingual ('Archaic'@en)"
      - pred: "skos:definition"
        range: "xsd:string"
        comment: "English, German, and Greek prose giving the date range"
      - pred: "crm:P4_has_time-span"
        range: "crm:E52_Time-Span"
        comment: "Blank node with crm:P82a_begin_of_the_begin and crm:P82b_end_of_the_end as xsd:gYear literals like \"-0600\"^^xsd:gYear; compare with xsd:integer(STR(?begin))"
      - pred: "skos:exactMatch"
        range: "xsd:anyURI"
        comment: "PeriodO (n2t.net/ark:/99152/...), ChronOntology, Getty AAT, EAGLE dates, Wikidata, British Museum"
